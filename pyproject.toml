[project]
name = "brain-spine-orchestrator"
version = "0.1.0"
description = "Adaptive multi-agent orchestration layer for the stimulation side of a brain-spine interface (BSI) — research simulator / digital twin. NOT a medical device."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Ihor Sharanda" }]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
]

[project.optional-dependencies]
viz = ["matplotlib>=3.7"]
physics = ["mujoco>=3.0"]
opensim = ["opensim>=4.5"]  # optional: future full musculoskeletal backend
dev = ["pytest>=7.0", "ruff>=0.1"]

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Embedded MJCF (XML) model has naturally long attribute lines.
"src/bso/biomech/mujoco_model.py" = ["E501"]
